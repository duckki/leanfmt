name = "leanfmt"
version = "0.4.4"
description = "A structure-preserving code formatter for Lean"
keywords = ["lean4", "formatter", "devtool", "development-tools"]
license = "MIT"
defaultTargets = ["LeanFmt", "fmt"]
testDriver = "testSuite"
# Older Lean shared libraries export mi_malloc_small weakly. Its zeroing variant
# is strong, keeping generated C and the runtime on the same allocator.
moreLeancArgs = ["-Dmi_malloc_small=mi_zalloc_small"]

[[lean_lib]]
name = "LeanFmt"

[[lean_lib]]
name = "LeanFmt.Tests"
roots = ["LeanFmt.Tests.Suite"]

[[lean_exe]]
name = "fmt"
root = "LeanFmt.Main"
supportInterpreter = true
# Native plugins must share the executable's Lean runtime.
moreLinkArgs = ["-lleanshared"]

[[lean_exe]]
name = "fmt-test"
root = "LeanFmt.Tests.Main"
supportInterpreter = true

[[lean_exe]]
name = "testSuite"
root = "LeanFmt.Tests.Run"
needs = ["fmt"]
supportInterpreter = true

[[lean_exe]]
name = "compatibilityTest"
root = "LeanFmt.Tests.Compatibility"
needs = ["fmt"]
supportInterpreter = true
